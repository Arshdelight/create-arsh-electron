name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # electron 42 ships no install script, so npm ci never downloads
      # the runtime binary — CI stays fast and needs no mirror config
      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test
